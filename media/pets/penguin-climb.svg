<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Seen from behind on the rungs: flippers and feet reach in opposite phase,
       and the whole body hitches upward on each pull. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3.5; 0 0" dur="0.7s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 5; 0 -5; 0 5" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="14" cy="26" rx="4.6" ry="12" fill="#111827" transform="rotate(24 14 26)"/>
      <ellipse cx="10" cy="16" rx="4" ry="3" fill="#f59e0b"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -5; 0 5; 0 -5" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="50" cy="26" rx="4.6" ry="12" fill="#111827" transform="rotate(-24 50 26)"/>
      <ellipse cx="54" cy="16" rx="4" ry="3" fill="#f59e0b"/>
    </g>

    <ellipse cx="32" cy="38" rx="17" ry="22" fill="#1f2937"/>
    <ellipse cx="32" cy="40" rx="10" ry="15" fill="#334155"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -4; 0 4; 0 -4" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="22" cy="59" rx="6.5" ry="3.2" fill="#f59e0b"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 4; 0 -4; 0 4" dur="0.7s" repeatCount="indefinite"/>
      <ellipse cx="42" cy="59" rx="6.5" ry="3.2" fill="#f59e0b"/>
    </g>

    <circle cx="32" cy="16" r="13.5" fill="#1f2937"/>
    <path d="M22 10 Q32 3 42 10 Q32 6 22 10 Z" fill="#111827"/>
    <circle cx="25.5" cy="18" r="2" fill="#f8fafc" opacity="0.85"/>
    <circle cx="38.5" cy="18" r="2" fill="#f8fafc" opacity="0.85"/>
  </g>
</svg>

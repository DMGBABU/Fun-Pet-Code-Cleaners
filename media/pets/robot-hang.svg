<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clamped to the line, legs hanging slack, hazard light turning. -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-6 32 2; 6 32 2; -6 32 2" dur="2.2s" repeatCount="indefinite"/>

    <line x1="32" y1="0" x2="32" y2="12" stroke="#a8a29e" stroke-width="3" stroke-linecap="round"/>
    <rect x="24" y="10" width="16" height="7" rx="3" fill="#475569"/>

    <rect x="19" y="14" width="9" height="18" rx="4.5" fill="#64748b" transform="rotate(14 23 23)"/>
    <rect x="36" y="14" width="9" height="18" rx="4.5" fill="#64748b" transform="rotate(-14 41 23)"/>

    <rect x="13" y="28" width="38" height="26" rx="9" fill="#94a3b8"/>
    <rect x="20" y="34" width="24" height="13" rx="4" fill="#334155"/>
    <circle cx="27" cy="40.5" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="40.5" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-11 32 54; 11 32 54; -11 32 54" dur="1.1s" repeatCount="indefinite"/>
      <rect x="19" y="53" width="12" height="10" rx="4" fill="#475569"/>
      <rect x="34" y="53" width="12" height="10" rx="4" fill="#475569"/>
    </g>

    <rect x="18" y="17" width="28" height="14" rx="6" fill="#cbd5e1"/>
    <rect x="23" y="20" width="18" height="8" rx="3.5" fill="#0f172a"/>
    <rect x="26" y="22" width="4.5" height="4.5" rx="1.5" fill="#22d3ee"/>
    <rect x="34" y="22" width="4.5" height="4.5" rx="1.5" fill="#22d3ee"/>
    <circle cx="52" cy="31" r="3" fill="#fb923c">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

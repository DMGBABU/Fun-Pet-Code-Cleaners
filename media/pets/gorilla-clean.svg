<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two hands on a wide push broom; slow, heavy strokes to match the build. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 3 0; 0 0" dur="1.1s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-12 40 34; 10 40 34; -12 40 34" dur="1.1s" repeatCount="indefinite"/>
      <line x1="40" y1="34" x2="52" y2="52" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
      <rect x="40" y="50" width="24" height="9" rx="3" fill="#d97706" transform="rotate(14 52 54)"/>
      <path d="M42 58 L43 64 M48 60 L49 64 M54 61 L55 64 M60 62 L61 64"
            stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <rect x="14" y="46" width="12" height="16" rx="6" fill="#1f2937"/>
    <rect x="28" y="46" width="12" height="16" rx="6" fill="#1f2937"/>

    <rect x="1" y="30" width="13" height="25" rx="6.5" fill="#1f2937"/>
    <ellipse cx="7" cy="56" rx="7.5" ry="4.2" fill="#374151"/>

    <path d="M9 34 Q27 20 45 34 Q45 52 27 54 Q9 52 9 34 Z" fill="#374151"/>
    <ellipse cx="27" cy="44" rx="10.5" ry="10.5" fill="#4b5563"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-12 40 34; 10 40 34; -12 40 34" dur="1.1s" repeatCount="indefinite"/>
      <rect x="35" y="28" width="12" height="22" rx="6" fill="#1f2937" transform="rotate(22 41 39)"/>
    </g>

    <circle cx="12" cy="20" r="5" fill="#374151"/>
    <circle cx="42" cy="20" r="5" fill="#374151"/>

    <ellipse cx="27" cy="20" rx="13.5" ry="12.5" fill="#374151"/>
    <path d="M16 14 Q27 6 38 14 Q27 10 16 14 Z" fill="#1f2937"/>
    <ellipse cx="28" cy="25" rx="9" ry="6.8" fill="#6b7280"/>
    <ellipse cx="25.5" cy="24" rx="1.5" ry="1.9" fill="#1f2937"/>
    <ellipse cx="31" cy="24" rx="1.5" ry="1.9" fill="#1f2937"/>
    <circle cx="22" cy="18" r="2.2" fill="#111827"/>
    <circle cx="32" cy="18" r="2.2" fill="#111827"/>
    <circle cx="22.8" cy="17.2" r="0.8" fill="#ffffff"/>
    <circle cx="32.8" cy="17.2" r="0.8" fill="#ffffff"/>
    <path d="M23 29 Q28 32 33 29" stroke="#374151" stroke-width="1.7"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>

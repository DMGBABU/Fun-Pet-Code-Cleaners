<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tilted forward, legs pumping at double rate, warning light strobing. -->
  <g transform="rotate(14 32 56)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -7; 0 0" dur="0.22s" repeatCount="indefinite"/>
      <rect x="15" y="52" width="13" height="10" rx="4" fill="#475569"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -7; 0 0; 0 -7" dur="0.22s" repeatCount="indefinite"/>
      <rect x="35" y="52" width="13" height="10" rx="4" fill="#475569"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -1.5; 0 0" dur="0.22s" repeatCount="indefinite"/>

      <rect x="12" y="26" width="40" height="28" rx="9" fill="#94a3b8"/>
      <rect x="19" y="33" width="26" height="14" rx="4" fill="#334155"/>
      <circle cx="27" cy="40" r="3" fill="#22d3ee"/>
      <circle cx="38" cy="40" r="3" fill="#f472b6"/>

      <rect x="2" y="28" width="9" height="18" rx="4.5" fill="#64748b" transform="rotate(-46 6.5 37)"/>
      <rect x="53" y="28" width="9" height="18" rx="4.5" fill="#64748b" transform="rotate(42 57.5 37)"/>

      <rect x="17" y="5" width="32" height="22" rx="8" fill="#cbd5e1"/>
      <rect x="22" y="11" width="22" height="11" rx="4.5" fill="#0f172a"/>
      <rect x="25" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>
      <rect x="35.5" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>

      <line x1="33" y1="5" x2="33" y2="1" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="33" cy="1.5" r="2.6" fill="#fb923c">
        <animate attributeName="opacity" values="1;0.15;1" dur="0.3s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g opacity="0.4" stroke="#94a3b8" stroke-width="2.4" stroke-linecap="round">
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="0.22s" repeatCount="indefinite"/>
      <line x1="0" y1="32" x2="10" y2="32"/>
      <line x1="0" y1="43" x2="8" y2="43"/>
    </g>
  </g>
</svg>

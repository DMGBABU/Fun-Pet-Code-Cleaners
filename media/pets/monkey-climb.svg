<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- In its element: tail curls round a rung while the arms haul it up. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -4.5; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="14 32 48; -14 32 48; 14 32 48" dur="1.2s" repeatCount="indefinite"/>
      <path d="M32 50 Q50 56 46 64" stroke="#a16207" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 7; 0 -7; 0 7" dur="0.6s" repeatCount="indefinite"/>
      <rect x="7" y="12" width="9" height="21" rx="4.5" fill="#854d0e" transform="rotate(18 11 22)"/>
      <ellipse cx="8" cy="11" rx="4.8" ry="3.6" fill="#fcd34d"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -7; 0 7; 0 -7" dur="0.6s" repeatCount="indefinite"/>
      <rect x="48" y="12" width="9" height="21" rx="4.5" fill="#854d0e" transform="rotate(-18 52 22)"/>
      <ellipse cx="56" cy="11" rx="4.8" ry="3.6" fill="#fcd34d"/>
    </g>

    <ellipse cx="32" cy="40" rx="15" ry="19" fill="#a16207"/>
    <ellipse cx="32" cy="43" rx="9.5" ry="13" fill="#fcd34d"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -5; 0 5; 0 -5" dur="0.6s" repeatCount="indefinite"/>
      <rect x="16" y="50" width="10" height="14" rx="5" fill="#854d0e"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 5; 0 -5; 0 5" dur="0.6s" repeatCount="indefinite"/>
      <rect x="38" y="50" width="10" height="14" rx="5" fill="#854d0e"/>
    </g>

    <circle cx="17" cy="17" r="6.6" fill="#a16207"/>
    <circle cx="17" cy="17" r="3.4" fill="#f9a8a8"/>
    <circle cx="47" cy="17" r="6.6" fill="#a16207"/>
    <circle cx="47" cy="17" r="3.4" fill="#f9a8a8"/>

    <circle cx="32" cy="16" r="13" fill="#a16207"/>
    <ellipse cx="32" cy="19" rx="9.8" ry="9.2" fill="#fcd34d"/>
    <circle cx="27.5" cy="14.5" r="2.2" fill="#1c1917"/>
    <circle cx="36.5" cy="14.5" r="2.2" fill="#1c1917"/>
    <ellipse cx="32" cy="21" rx="2.5" ry="1.8" fill="#78350f"/>
  </g>
</svg>

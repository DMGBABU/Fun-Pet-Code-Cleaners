    <circle cx="28.6" cy="20.5" r="2.2" fill="#111827"/>
    <circle cx="37.6" cy="20.5" r="2.2" fill="#111827"/>
    <circle cx="29.4" cy="19.7" r="0.8" fill="#ffffff"/>
    <circle cx="38.4" cy="19.7" r="0.8" fill="#ffffff"/>
    <path d="M33 25 L39.5 28 L33 31 Z" fill="#f59e0b"/>
  </g>
</svg>

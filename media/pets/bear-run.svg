<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g transform="rotate(13 32 56)">
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-34 22 52; 26 22 52; -34 22 52" dur="0.23s" repeatCount="indefinite"/>
      <rect x="16" y="48" width="13" height="15" rx="6.5" fill="#78350f"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="28 42 52; -30 42 52; 28 42 52" dur="0.23s" repeatCount="indefinite"/>
      <rect x="35" y="48" width="13" height="15" rx="6.5" fill="#78350f"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -2.5; 0 0" dur="0.23s" repeatCount="indefinite"/>

      <ellipse cx="32" cy="40" rx="21" ry="16" fill="#92400e"/>
      <ellipse cx="33" cy="44" rx="12" ry="10" fill="#c2854b"/>

      <rect x="4" y="28" width="11" height="18" rx="5.5" fill="#78350f" transform="rotate(-48 9 37)"/>
      <rect x="49" y="28" width="11" height="18" rx="5.5" fill="#78350f" transform="rotate(44 54 37)"/>

      <circle cx="20" cy="9" r="6.6" fill="#92400e"/>
      <circle cx="20" cy="9" r="3.2" fill="#c2854b"/>
      <circle cx="47" cy="8" r="6.6" fill="#92400e"/>
      <circle cx="47" cy="8" r="3.2" fill="#c2854b"/>

      <circle cx="34" cy="19" r="14.5" fill="#92400e"/>
      <ellipse cx="37" cy="26" rx="9.5" ry="7" fill="#fde68a"/>
      <ellipse cx="38" cy="22.5" rx="3.8" ry="2.8" fill="#451a03"/>
      <circle cx="29" cy="15" r="2.2" fill="#1c1917"/>
      <circle cx="42" cy="15" r="2.2" fill="#1c1917"/>
      <circle cx="29.8" cy="14.2" r="0.8" fill="#ffffff"/>
      <circle cx="42.8" cy="14.2" r="0.8" fill="#ffffff"/>
    </g>

    <g opacity="0.35" stroke="#a8a29e" stroke-width="2.4" stroke-linecap="round">

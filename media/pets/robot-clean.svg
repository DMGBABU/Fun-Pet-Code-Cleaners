<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Squeegee arm sweeps a wide arc; the body counter-rotates slightly into the stroke. -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-3 26 60; 4 26 60; -3 26 60" dur="0.7s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-32 44 34; 26 44 34; -32 44 34" dur="0.7s" repeatCount="indefinite"/>
      <rect x="40" y="30" width="9" height="20" rx="4.5" fill="#64748b" transform="rotate(28 44 40)"/>
      <g transform="rotate(30 54 54)">
        <rect x="42" y="50" width="22" height="6" rx="3" fill="#0ea5e9"/>
        <rect x="42" y="55" width="22" height="4" rx="2" fill="#e2e8f0"/>
      </g>
      <circle cx="50" cy="48" r="2.4" fill="#bae6fd">
        <animate attributeName="cy" values="48;62" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.9;0" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect x="12" y="52" width="13" height="10" rx="4" fill="#475569"/>
    <rect x="29" y="52" width="13" height="10" rx="4" fill="#475569"/>

    <rect x="9" y="26" width="38" height="28" rx="9" fill="#94a3b8"/>
    <rect x="16" y="33" width="24" height="14" rx="4" fill="#334155"/>
    <circle cx="23" cy="40" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="34" cy="40" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="30" width="9" height="18" rx="4.5" fill="#64748b"/>

    <rect x="13" y="5" width="32" height="22" rx="8" fill="#cbd5e1"/>
    <rect x="18" y="11" width="22" height="11" rx="4.5" fill="#0f172a"/>
    <rect x="21" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>
    <rect x="31.5" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>

    <line x1="29" y1="5" x2="29" y2="1" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="29" cy="1.5" r="2.4" fill="#4ade80">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

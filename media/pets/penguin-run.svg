<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Leaning into it, flippers swept back, legs cycling twice as fast as the walk. -->
  <g transform="rotate(12 32 54)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -6; 0 0" dur="0.26s" repeatCount="indefinite"/>
      <ellipse cx="24" cy="60" rx="7" ry="3.2" fill="#f59e0b" transform="rotate(-18 24 60)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -6; 0 0; 0 -6" dur="0.26s" repeatCount="indefinite"/>
      <ellipse cx="41" cy="60" rx="7" ry="3.2" fill="#f59e0b" transform="rotate(-18 41 60)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -2; 0 0" dur="0.26s" repeatCount="indefinite"/>

      <ellipse cx="32" cy="38" rx="19" ry="20" fill="#1f2937"/>
      <ellipse cx="33" cy="41" rx="12" ry="14" fill="#f8fafc"/>

      <ellipse cx="13" cy="33" rx="5" ry="13" fill="#111827" transform="rotate(-52 13 33)"/>
      <ellipse cx="50" cy="31" rx="5" ry="12" fill="#111827" transform="rotate(-38 50 31)"/>

      <circle cx="34" cy="18" r="15" fill="#1f2937"/>
      <ellipse cx="35" cy="21" rx="11" ry="10" fill="#f8fafc"/>
      <circle cx="31" cy="17" r="2.4" fill="#111827"/>
      <circle cx="41" cy="17" r="2.4" fill="#111827"/>
      <circle cx="31.9" cy="16.1" r="0.85" fill="#ffffff"/>
      <circle cx="41.9" cy="16.1" r="0.85" fill="#ffffff"/>
      <path d="M36 22 L44 25.5 L36 29 Z" fill="#f59e0b"/>
    </g>

    <g opacity="0.35" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="0.26s" repeatCount="indefinite"/>
      <line x1="2" y1="34" x2="12" y2="34"/>
      <line x1="1" y1="44" x2="9" y2="44"/>
    </g>
  </g>
</svg>

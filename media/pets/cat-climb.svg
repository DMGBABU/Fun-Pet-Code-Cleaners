<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Clinging to the rungs, paws reaching in opposite phase, tail counterbalancing. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -3.5; 0 0" dur="0.66s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="16 32 46; -16 32 46; 16 32 46" dur="1.3s" repeatCount="indefinite"/>
      <path d="M32 48 Q46 54 44 63" stroke="#fb923c" stroke-width="5.5" fill="none" stroke-linecap="round"/>
      <path d="M44 58 Q46 61 44.6 63" stroke="#f8fafc" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 6; 0 -6; 0 6" dur="0.66s" repeatCount="indefinite"/>
      <rect x="9" y="16" width="8" height="18" rx="4" fill="#ea580c" transform="rotate(16 13 25)"/>
      <ellipse cx="10" cy="15" rx="4.6" ry="3.4" fill="#fed7aa"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -6; 0 6; 0 -6" dur="0.66s" repeatCount="indefinite"/>
      <rect x="47" y="16" width="8" height="18" rx="4" fill="#ea580c" transform="rotate(-16 51 25)"/>
      <ellipse cx="54" cy="15" rx="4.6" ry="3.4" fill="#fed7aa"/>
    </g>

    <ellipse cx="32" cy="38" rx="17" ry="21" fill="#fb923c"/>
    <path d="M20 30 Q32 26 44 30" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M20 42 Q32 38 44 42" stroke="#ea580c" stroke-width="3" fill="none" stroke-linecap="round"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -5; 0 5; 0 -5" dur="0.66s" repeatCount="indefinite"/>
      <rect x="17" y="48" width="8" height="14" rx="4" fill="#f97316"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 5; 0 -5; 0 5" dur="0.66s" repeatCount="indefinite"/>
      <rect x="39" y="48" width="8" height="14" rx="4" fill="#f97316"/>
    </g>

    <path d="M19 2 L20 16 L31 10 Z" fill="#fb923c"/>
    <path d="M45 2 L44 16 L33 10 Z" fill="#fb923c"/>
    <circle cx="32" cy="17" r="13" fill="#fb923c"/>
    <circle cx="27" cy="16" r="2.4" fill="#14532d"/>
    <circle cx="37" cy="16" r="2.4" fill="#14532d"/>
    <path d="M32.2 20 L34.4 22 L32.2 23.9 L30 22 Z" fill="#be123c"/>
  </g>
</svg>

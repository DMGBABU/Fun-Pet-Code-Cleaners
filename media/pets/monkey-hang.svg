<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hanging by the tail, arms free — the one pet that would actually do this. -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      values="-9 32 2; 9 32 2; -9 32 2" dur="1.9s" repeatCount="indefinite"/>

    <line x1="32" y1="0" x2="32" y2="10" stroke="#a8a29e" stroke-width="3" stroke-linecap="round"/>
    <path d="M32 6 Q42 10 38 18 Q34 22 32 20" stroke="#a16207" stroke-width="4.5"
          fill="none" stroke-linecap="round"/>

    <ellipse cx="32" cy="40" rx="15.5" ry="16" fill="#a16207"/>
    <ellipse cx="32" cy="44" rx="9.8" ry="10" fill="#fcd34d"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-16 32 34; 16 32 34; -16 32 34" dur="0.95s" repeatCount="indefinite"/>
      <rect x="9" y="34" width="9" height="20" rx="4.5" fill="#854d0e" transform="rotate(16 13 44)"/>
      <rect x="46" y="34" width="9" height="20" rx="4.5" fill="#854d0e" transform="rotate(-16 50 44)"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="10 32 52; -10 32 52; 10 32 52" dur="0.95s" repeatCount="indefinite"/>
      <rect x="20" y="53" width="10" height="11" rx="5" fill="#854d0e"/>
      <rect x="34" y="53" width="10" height="11" rx="5" fill="#854d0e"/>
    </g>

    <circle cx="18" cy="27" r="6.6" fill="#a16207"/>
    <circle cx="18" cy="27" r="3.4" fill="#f9a8a8"/>
    <circle cx="46" cy="27" r="6.6" fill="#a16207"/>
    <circle cx="46" cy="27" r="3.4" fill="#f9a8a8"/>

    <circle cx="32" cy="26" r="13.5" fill="#a16207"/>
    <ellipse cx="32" cy="29" rx="10" ry="9.5" fill="#fcd34d"/>
    <circle cx="27.5" cy="24" r="2.3" fill="#1c1917"/>
    <circle cx="36.5" cy="24" r="2.3" fill="#1c1917"/>
    <circle cx="28.3" cy="23.1" r="0.8" fill="#ffffff"/>
    <circle cx="37.3" cy="23.1" r="0.8" fill="#ffffff"/>
    <ellipse cx="32" cy="31" rx="2.6" ry="1.9" fill="#78350f"/>
    <path d="M28 34.5 Q32 38 36 34.5" stroke="#78350f" stroke-width="1.7"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 0 -2; 0 0" dur="0.48s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 0 -4; 0 0" dur="0.48s" repeatCount="indefinite"/>
      <rect x="14" y="52" width="14" height="10" rx="4" fill="#475569"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 -4; 0 0; 0 -4" dur="0.48s" repeatCount="indefinite"/>
      <rect x="36" y="52" width="14" height="10" rx="4" fill="#475569"/>
    </g>

    <rect x="12" y="26" width="40" height="28" rx="9" fill="#94a3b8"/>
    <rect x="19" y="33" width="26" height="14" rx="4" fill="#334155"/>
    <circle cx="27" cy="40" r="3" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="38" cy="40" r="3" fill="#f472b6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite"/>
    </circle>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-16 9 32; 12 9 32; -16 9 32" dur="0.48s" repeatCount="indefinite"/>
      <rect x="3" y="30" width="9" height="18" rx="4.5" fill="#64748b"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="16 55 32; -12 55 32; 16 55 32" dur="0.48s" repeatCount="indefinite"/>
      <rect x="52" y="30" width="9" height="18" rx="4.5" fill="#64748b"/>
    </g>

    <rect x="16" y="5" width="32" height="22" rx="8" fill="#cbd5e1"/>
    <rect x="21" y="11" width="22" height="11" rx="4.5" fill="#0f172a"/>
    <rect x="24" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>
    <rect x="34.5" y="14" width="5.5" height="5.5" rx="1.8" fill="#22d3ee"/>

    <line x1="32" y1="5" x2="32" y2="1" stroke="#64748b" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="32" cy="1.5" r="1.5" fill="#f87171">
      <animate attributeName="r" values="1.5;3;1.5" dur="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

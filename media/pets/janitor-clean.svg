<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Spray bottle in one hand, cloth in the other: spritz, then buff. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 0; 1.5 0; 0 0" dur="0.9s" repeatCount="indefinite"/>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-16 40 30; 14 40 30; -16 40 30" dur="0.45s" repeatCount="indefinite"/>
      <rect x="38" y="29" width="8" height="16" rx="4" fill="#f8fafc" transform="rotate(30 42 37)"/>
      <circle cx="48" cy="44" r="4.2" fill="#e8b08a"/>
      <rect x="44" y="46" width="14" height="11" rx="3" fill="#fde68a" transform="rotate(16 51 51)"/>
      <path d="M46 50 L56 53 M45 54 L54 57" stroke="#f59e0b" stroke-width="1.4" stroke-linecap="round"/>
    </g>

    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="10 24 30; -6 24 30; 10 24 30" dur="0.9s" repeatCount="indefinite"/>
      <rect x="16" y="29" width="8" height="16" rx="4" fill="#f8fafc" transform="rotate(-26 20 37)"/>
      <circle cx="13" cy="45" r="4.2" fill="#e8b08a"/>
      <rect x="6" y="46" width="11" height="14" rx="3" fill="#38bdf8"/>
      <rect x="9" y="42" width="5" height="5" rx="1.5" fill="#0284c7"/>
      <path d="M4 44 L1 41 M5 40 L3 36" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round">
        <animate attributeName="opacity" values="0;1;0" dur="0.9s" repeatCount="indefinite"/>
      </path>
    </g>

    <rect x="23" y="43" width="9" height="18" rx="4.5" fill="#1d4ed8"/>
    <rect x="21" y="58" width="12" height="6" rx="2.5" fill="#1c1917"/>
    <rect x="33" y="43" width="9" height="18" rx="4.5" fill="#2563eb"/>
    <rect x="32" y="58" width="12" height="6" rx="2.5" fill="#292524"/>

    <rect x="22" y="24" width="20" height="24" rx="6" fill="#2563eb"/>
    <rect x="27" y="24" width="10" height="10" rx="2" fill="#1d4ed8"/>
    <rect x="25" y="36" width="8" height="7" rx="2" fill="#1e40af"/>

    <circle cx="32" cy="14" r="11" fill="#e8b08a"/>
    <path d="M21 12 Q32 2 43 12 L43 9 Q32 0 21 9 Z" fill="#78350f"/>
    <rect x="19" y="8" width="26" height="6" rx="3" fill="#1e3a8a"/>
    <rect x="18" y="12" width="16" height="3" rx="1.5" fill="#1d4ed8"/>
    <circle cx="28" cy="16" r="1.9" fill="#1c1917"/>
    <circle cx="36" cy="16" r="1.9" fill="#1c1917"/>
    <circle cx="28.7" cy="15.3" r="0.7" fill="#ffffff"/>
    <circle cx="36.7" cy="15.3" r="0.7" fill="#ffffff"/>
    <path d="M29 20.5 Q32 23 35 20.5" stroke="#b45309" stroke-width="1.5"
          fill="none" stroke-linecap="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Zs drift up and fade, staggered so there is always one in flight. -->
  <g fill="#93c5fd" font-family="Verdana,DejaVu Sans,sans-serif" font-weight="bold">
    <text x="10" y="56" font-size="20">z
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 4 -30" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1"
               dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="44" font-size="26">z
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 5 -30" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1"
               dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="36" y="30" font-size="32">z
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 6 -28" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.7;1"
               dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>

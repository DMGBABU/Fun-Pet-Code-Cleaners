<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Two notes bob and drift while a pet dances. -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0 2; 0 -4; 0 2" dur="1.1s" repeatCount="indefinite"/>
    <g fill="#f472b6">
      <ellipse cx="16" cy="46" rx="9" ry="7" transform="rotate(-18 16 46)"/>
      <rect x="22" y="14" width="4.5" height="30" rx="2"/>
      <path d="M26.5 14 Q38 17 38 27 Q34 20 26.5 22 Z"/>
    </g>
    <g fill="#a78bfa">
      <animateTransform attributeName="transform" type="translate"
                        values="0 0; 3 -6; 0 0" dur="1.5s" repeatCount="indefinite"/>
      <ellipse cx="44" cy="30" rx="7" ry="5.5" transform="rotate(-18 44 30)"/>
      <rect x="48.5" y="8" width="3.6" height="22" rx="1.8"/>
      <path d="M52 8 Q60 10 60 17 Q57 12 52 13.5 Z"/>
    </g>
  </g>
</svg>
